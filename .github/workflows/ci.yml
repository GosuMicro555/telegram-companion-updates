name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Ubuntu desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify model manifest
        run: go run ./scripts/fetch_model.go -verify-manifest-only
      - name: Test Go
        env:
          GOMAXPROCS: "2"
        run: |
          go test -p=1 ./...
          go test -p=1 -tags desktop ./...
          go test -p=1 -race ./...
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run && npm run build
      - name: Lint
        env:
          GOMAXPROCS: "1"
        run: golangci-lint run --concurrency 1 ./...
      - name: Build Wails
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            wails build -clean -skipbindings -tags desktop,webkit2_41
          else
            wails build -clean -skipbindings -tags desktop
          fi

  public-macos-arm64-contract:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true
      - name: Validate pinned public release inputs
        shell: bash
        run: |
          bash -n scripts/release/macos-arm64/*.sh
          source scripts/release/macos-arm64/lib.sh
          validate_payload_manifest
      - name: Fetch pinned Sparkle framework
        shell: bash
        run: |
          sparkle_url="$(jq -r '.payloads[] | select(.name == "sparkle") | .url' resources/macos-arm64/payload-manifest.json)"
          sparkle_sha="$(jq -r '.payloads[] | select(.name == "sparkle") | .sha256' resources/macos-arm64/payload-manifest.json)"
          sparkle_root="$RUNNER_TEMP/telegram-companion-sparkle"
          sparkle_archive="$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$sparkle_root"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$sparkle_archive" "$sparkle_url"
          printf '%s  %s\n' "$sparkle_sha" "$sparkle_archive" | shasum -a 256 -c -
          tar -xf "$sparkle_archive" -C "$sparkle_root"
          sparkle_framework="$(find "$sparkle_root" -type d -name Sparkle.framework -print -quit)"
          test -d "$sparkle_framework"
          sparkle_parent="$(dirname "$sparkle_framework")"
          printf 'CGO_CFLAGS=-F%s -arch arm64\n' "$sparkle_parent" >> "$GITHUB_ENV"
          printf 'CGO_LDFLAGS=-F%s -Wl,-rpath,@executable_path/../Frameworks -arch arm64\n' "$sparkle_parent" >> "$GITHUB_ENV"
      - name: Compile public macOS ARM64 packages without release secrets
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          REVOCATION_MANIFEST_URL: https://raw.githubusercontent.com/GosuMicro555/telegram-companion-updates/main/revocations.tcrev
          REVOCATION_KEY_ID: revocation-2026-01
          REVOCATION_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          REVOCATION_BUILD_METADATA: TCREVBUILD1|https://raw.githubusercontent.com/GosuMicro555/telegram-companion-updates/main/revocations.tcrev|revocation-2026-01|AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: >-
          go test -exec /usr/bin/true -tags desktop,public_macos_arm64
          -ldflags "-X telegram-companion/internal/buildinfo.revocationManifestURL=$REVOCATION_MANIFEST_URL
          -X telegram-companion/internal/buildinfo.revocationKeyID=$REVOCATION_KEY_ID
          -X telegram-companion/internal/buildinfo.revocationPublicKey=$REVOCATION_PUBLIC_KEY
          -X telegram-companion/internal/buildinfo.revocationBuildMetadata=$REVOCATION_BUILD_METADATA" ./...
